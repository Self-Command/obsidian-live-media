name: Build once and verify candidate
on:
  push:
    branches: [codex/live-media, main]
    paths-ignore: ['docs/**', 'research/**', README.md]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-media-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Pinned Emscripten toolchain
        run: |
          git clone --quiet https://github.com/emscripten-core/emsdk.git build-emsdk
          git -C build-emsdk checkout --quiet 389a68bc35dcff7ebae4614e1615099dafda00d1
          build-emsdk/emsdk install 4.0.15
          build-emsdk/emsdk activate 4.0.15
      - name: Build offline codecs
        run: |
          source build-emsdk/emsdk_env.sh
          bash scripts/build-codecs.sh
      - name: Build pinned minimal FFmpeg core
        run: |
          build-emsdk/emsdk install 3.1.40
          build-emsdk/emsdk activate 3.1.40
          source build-emsdk/emsdk_env.sh
          bash scripts/build-ffmpeg.sh
      - run: npm run build
      - name: Collect codec source and licenses
        run: python3 scripts/source-archive.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
      - name: Corresponding codec source and build inputs
        run: |
          tar --exclude='.git' --exclude='*.o' --exclude='*.a' -czf codec-corresponding-source.tar.gz build/codec-sources codecs scripts/build-codecs.sh scripts/build-ffmpeg.sh package-lock.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corresponding-source-${{ github.sha }}
          path: codec-corresponding-source.tar.gz
  test-artifact:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build-${{ github.sha }}
          path: dist/
      - run: npm run verify:package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-evidence-${{ github.sha }}
          path: playwright-report/
      - name: Candidate install package from tested artifact
        run: |
          mkdir candidate
          cp dist/main.js dist/manifest.json dist/styles.css dist/provenance.json LICENSE candidate/
          cp -r dist/licenses candidate/
          cp codecs/BUILDING.md candidate/CODEC-BUILDING.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ github.sha }}
          path: candidate/
